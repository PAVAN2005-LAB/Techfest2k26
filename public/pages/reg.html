<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" media="screen and (max-width:920px )" href="/css/nav-responsive.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <!--link for css file-->
  <script src="https://kit.fontawesome.com/0b62b37b15.js" crossorigin="anonymous"></script>
  <!-- link for social media logo -->
  <script src="https://kit.fontawesome.com/0b62b37b15.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/png" href="/images/TRIVIDYA2K26_LOGO.png">
  <link rel="stylesheet" href="/css/reg.css">
</head>

<body>
  <!-- Top Bar -->
  <script src="/js/navbar.js"></script>
  <div class="container">
    <h1 class="container__form-title">REGISTRATION</h1>
    <form action="/register" method="POST">
      <div class="container__main-user-info">
        <!--the elemnts in form -->
        <div class="container__user-input-box">
          <label for="fullName">First Name</label>
          <input type="text" id="container__firstName" name="fullName" placeholder="Enter first name"
            title="Please enter your first name" required>
        </div>
        <div class="container__user-input-box">
          <label for="lastName">Last Name</label>
          <input type="text" id="container__lastName" name="lastName" placeholder="Enter last name" required>

        </div>
      </div>
      <div class="container__gender-details-box">
        <span class="container__gender-title">Gender</span>
        <div class="container__gender-category">
          <input type="radio" name="gender" id="male" value="male" required>
          <label for="male">Male</label>
          <input type="radio" name="gender" id="female" value="female" required>
          <label for="female">Female</label>
          <input type="radio" name="gender" id="other" value="other" required>
          <label for="other">Other</label>
        </div>
      </div>

      <div class="container__main-user-info">
        <div class="container__user-input-box">
          <label for="Email">Email</label>
          <input type="email" id="container__email" name="email" placeholder="Enter email" pattern=".+@gecdahod\.ac\.in"
            title="Please enter an email address ending with @gecdahod.ac.in" required>
        </div>

        <div class="container__user-input-box">
          <label for="phoneNumber">Phone Number</label>
          <input type="number" id="container__phoneNumber" name="phoneNumber" placeholder="Enter phone number"
            required />
        </div>
        <div class="container__user-input-box">
          <label for="programType">Program Type</label>
          <select id="container__programType" name="programType" onchange="loadEvents()" required>
            <option value="" selected>--Select Program--</option>
            <option value="spardha">Spardha 2k26</option>
            <option value="techfest">Techfest 2k26</option>
            <option value="trividya">Trividya 2k26</option>
          </select>
        </div>

        <div class="container__user-input-box">
          <label for="select_event">Select Event</label>
          <select id="container__event" name="event" required>
            <option value="">--Select Program first--</option>
            <!-- Events loaded dynamically from API -->
          </select>
        </div>




        <div class="container__user-input-box">
          <label for="College">College Name</label>
          <input type="text" id="container__collegeName" name="CollegeName" placeholder="College name" required />
        </div>

        <div class="container__user-input-box">
          <label for="container__branch">Branch</label>
          <select id="container__branch" name="branch" required>
            <option value="" selected>--Select an option--</option>
            <option value="Computer">Computer</option>
            <option value="Electrical">Electrical</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="E&C">E&C</option>

          </select>
        </div>
        <div class="container__user-input-box">
          <label for="container__sem">Semester</label>
          <select id="container__sem" name="sem" required>
            <option value="">--Select an option--</option>
            <option value="1st">1st</option>
            <option value="2nd">2nd</option>
            <option value="3rd">3rd</option>
            <option value="4th">4th</option>
            <option value="5th">5th</option>
            <option value="6th">6th</option>
            <option value="7th">7th</option>
            <option value="8th">8th</option>

          </select>
        </div>
        <div class="container__user-input-box">
          <label for="Enrollment No">Enrollment No</label>
          <input type="number" id="container__enrollmentNo" name="enrollmentNo" pattern="[0-9]{12}"
            placeholder="Enrollment No" required />
        </div>
      </div>





      <!-- Event Price Display -->
      <div id="price-display"
        style="display: none; margin: 20px 0; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="color: white; font-size: 14px; margin-bottom: 5px;">Registration Fee</div>
        <div id="price-amount" style="color: white; font-size: 32px; font-weight: bold;">₹0</div>
        <div id="price-event" style="color: rgba(255,255,255,0.9); font-size: 12px; margin-top: 5px;">Select an event to
          see price</div>
      </div>

      <button class="container__btn" type="submit" id="submit-btn">
        <span id="btn-text">Pay & Register</span>
      </button>

    </form>
  </div>

  <footer class="footer"></footer>
  <script src="/js/footer.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/js/reg.js"></script>
</body>

</html>
